server {
    listen 80;
    server_name example.com www.example.com; # ganti dengan domain Anda

    # Redirect all HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com; # ganti dengan domain Anda

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # path certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Optional: improve security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy to the Node app (PM2 running on localhost:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploads directly (optional)
    location /uploads/ {
        alias /path/to/app/uploads/; # ganti path jika perlu
        access_log off;
        expires 7d;
    }
}

# Certbot example (run on server):
# sudo mkdir -p /var/www/letsencrypt
# sudo chown $USER:$USER /var/www/letsencrypt
# sudo certbot certonly --webroot -w /var/www/letsencrypt -d example.com -d www.example.com
# Setelah cert terbit, reload nginx: sudo systemctl reload nginx

# Untuk otomatis perpanjangan:
# sudo certbot renew --dry-run
