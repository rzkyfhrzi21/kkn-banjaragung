name: Deploy to Production (SSH Tar)

on:
  push:
    branches:
      - main

jobs:
  production-deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode terbaru dari GitHub
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 2. Kompres file proyek dengan mengecualikan folder/file sensitif & dinamis.
      #    node_modules & .env TIDAK dikirim — diinstall/dikelola manual di cPanel.
      - name: 📦 Compress files
      - name: 📦 Compress files
        run: |
          tar -czvf ../deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.grok' \
            --exclude='.rtk' \
            --exclude='.vscode' \
            --exclude='@agents' \
            --exclude='docs' \
            --exclude='Zzz' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='uploads' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='GEMINI.md' \
            --exclude='README.md' \
            --exclude='nginx-pekon-banjaragung.conf' \
            .
          mv ../deploy.tar.gz .

      # 5. Unggah file tar.gz ke server
      - name: 🚀 Upload via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: ${{ secrets.SSH_DIRECTORY }}

      # 4. Ekstrak arsip di server (tanpa npm/PM2 — dikelola manual via cPanel)
      - name: 🛠️ Extract on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SSH_DIRECTORY }}
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
